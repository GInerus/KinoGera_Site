<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>KinoGera — Связь</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <style>
        .contact-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            text-align: center;
            color: #eee;
            padding: 20px;
        }

        .contact-container h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .contact-container p {
            font-size: 1.2rem;
            margin: 10px 0;
            color: #ccc;
        }

        .contact-container a {
            color: #0af;
            text-decoration: none;
        }

        .contact-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div id="header"></div>
    
    <main class="container">
        <div class="contact-container">
            <h1>Связь с KinoGera</h1>
            <img src="/images/icons/logo.png" alt="developer's logo" style="width: 10%;">
            <p>Сайт находится в разработке.</p>
            <p>Для приобретения сайта обратитесь к нам по номеру:</p>
            <p><strong>+7 978 666-42-67</strong></p>
            <p>Или напишите на почту:</p>
            <p><a href="mailto:kinogera.ispp@mail.com">kinogera.ispp@mail.com</a></p>
        </div>
    </main>
    
    <div id="footer"></div>
    
    <script src="/js/main.js"></script>
</body>
</html>
